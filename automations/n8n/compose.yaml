# SOLO desarrollo local. No conecta WhatsApp, Supabase ni cuentas reales.
name: aurea-n8n-local
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.7
    restart: "no"
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: America/Mexico_City
      GENERIC_TIMEZONE: America/Mexico_City
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # HTTP exclusivamente en loopback; no reutilizar esta configuración en Internet.
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
