# Desarrollo local exclusivamente; no enlaza ni despliega proyectos remotos.
project_id = "aurea-backend-dev"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true

[storage]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

# Meta no envía JWT de Supabase. El handler verifica HMAC de Meta y token n8n.
# Solo configura una función NUEVA; no cambia Auth ni la API del panel.
[functions.whatsapp-webhook]
verify_jwt = false
